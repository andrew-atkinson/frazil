# Test configuration. Keeping it in the repo pins pytest's root here, so a config
# file in a parent folder can't change how the tests run.
#   pytest            fast tier (no data needed)
#   pytest --slow     also the end-to-end tests that need data/ and data/models/
[pytest]
testpaths = tests
markers =
    slow: needs data/ and trained models; run with --slow
filterwarnings =
    ignore::DeprecationWarning:xarray.*
