# @package _global_
# Clean A/B for correcting predictions instead of targets (ISS-030,
# experiments/2026-11-14_assumptions_review, C2): the fine-tune that made v0.4.0's line
# (pf_qm_ema: 20k steps, EMA 0.999; seed 1 as pf_qm_ema_qmw), but on the teacher's own,
# physically consistent states and seeded from the teacher-trained monthly_pf. The quantile
# map is applied to the predicted members afterwards, not to the targets.
# A/B partner: monthly_pf_qm_ema_qmw (v0.4.0, same seed), which has had 60k more steps on QM
# targets. Reference without this fine-tune: monthly_pf + QM of predictions.
#
# After:   the ERA5 hindcast (--forcing era5 --start 2018-12 --years 7 --n-ens 8 --save-members),
#          eval_monthly.py --save-fields on data/train_data/monthly_datacube, then
#          teacher_space.py and teacher_space_hindcast.py in the experiment folder.
# RESUMABLE: re-run the same command; it auto-continues from last.ckpt.
# Run:  python train.py +experiment=pf_ema
defaults:
  - pf_qm_ema
  - _self_

exp_name: monthly_pf_ema
seed: 1
init_from: data/models/monthly_pf/last.ckpt

data:
  suffix: _monthly
