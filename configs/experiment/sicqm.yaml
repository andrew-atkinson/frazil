# @package _global_
# Quantile-mapped-target fine-tune, for Apple Silicon.
#
# Teaches the monthly model obs-consistent sea-ice concentration by fine-tuning on
# the `sic` targets quantile-mapped to NSIDC-0051 (correct_sic_targets_qm.py) --
# the real fix for the ~0.38 M km² September over-icing inherited from neXtSIM.
#
# Applied on top of the base config (configs/config_train_monthly_mac.yaml). Reuses its normalization: quantile
# mapping only redistributes sic within [0,1], so the fixed encoder/decoder scaling
# still applies and the fine-tune adapts to the small distribution shift (re-run
# estimate_normalization for a from-scratch production run, not needed here).
#
# RESUMABLE: re-run the same command; it auto-continues from
#   data/models/monthly_qm/last.ckpt
#
# Prereq:  python experiments/correct_sic_targets_qm.py
#          python experiments/build_zarr_monthly.py --datacube-dir data/train_data/monthly_datacube_sicqm --suffix _sicqm
# Run:     python train.py +experiment=sicqm

exp_name: monthly_qm
init_from: data/models/monthly/monthly.ckpt   # seed from the base model (isolates the target-QM effect)
ckpt_path: null
compile: false

# Short, gentle fine-tune (not from scratch).
surrogate:
  lr: 0.0001
  lr_warmup: 100
  total_steps: 20000

data:
  suffix: _sicqm        # -> train_sicqm.zarr / validation_sicqm.zarr

trainer:
  max_steps: 20000
