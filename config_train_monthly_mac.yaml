hydra:
  run:
    dir: data/models/${exp_name}
  sweep:
    dir: data/models
    subdir: ${exp_name}
trainer:
  _target_: lightning.pytorch.Trainer
  enable_checkpointing: true
  accelerator: cuda
  max_epochs: -1
  max_steps: 1000000
  benchmark: true
  deterministic: false
  val_check_interval: 2000
  check_val_every_n_epoch: null
  default_root_dir: data/models/${exp_name}
  devices: ${devices}
  num_nodes: ${nodes}
  precision: bf16-mixed
  strategy: ddp
callbacks:
  learning_rate_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
  model_checkpoint_best:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: data/models/${exp_name}
    filename: best
    auto_insert_metric_name: false
    save_top_k: 1
    monitor: val/loss
    save_last: false
    save_weights_only: false
  model_checkpoint_last:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: data/models/${exp_name}
    filename: last
    auto_insert_metric_name: false
    save_top_k: 1
    save_on_train_epoch_end: true
    monitor: null
    every_n_epochs: 1
    save_last: true
    save_weights_only: false
  model_checkpoint_step:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: data/models/${exp_name}
    filename: step_{step:05d}
    auto_insert_metric_name: false
    save_top_k: -1
    monitor: null
    every_n_train_steps: 500
    save_last: false
    save_weights_only: true
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 3
  tqdm_pbar:
    _target_: lightning.pytorch.callbacks.TQDMProgressBar
    refresh_rate: 500
logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: gensim
  save_dir: data
  name: ${exp_name}
  log_model: false
  tags:
  - surrogate
  - train
  offline: true
  mode: offline
surrogate:
  network:
    _target_: gensim.network.Transformer
    n_input: 24
    n_output: 6
    n_features: 256
    n_blocks: 4
    n_heads: 8
    n_features_head: 32
    n_rope_features: 16
    n_embedding: 256
    n_time_in: 1
    n_res_in: 1
    n_augment_in: 3
    mult: 2
    patch_size: 2
    dropout_mlp: 0.0
    lengthscale: 10
    long_skips: true
  encoder:
    _target_: gensim.encoder_decoder.GaussianEncoder
    mean:
    - 0.8547
    - 0.4886
    - 0.3648
    - -0.0026
    - -0.0079
    - 0.0767
    - 268.4823
    - 0.003
    - 0.4319
    - -0.3839
    - 268.4823
    - 0.003
    - 0.4319
    - -0.3839
    - 3.636
    - 6.5036
    - 3.6278
    - 6.5308
    std:
    - 1.0143
    - 0.4627
    - 0.4095
    - 0.0294
    - 0.0351
    - 0.1232
    - 12.3422
    - 0.0023
    - 2.3709
    - 2.2041
    - 12.3422
    - 0.0023
    - 2.3709
    - 2.2041
    - 5.0006
    - 8.946
    - 4.2851
    - 5.1714
  decoder:
    _target_: gensim.encoder_decoder.GaussianDecoder
    mean:
    - -0.0016
    - -0.0001
    - -0.0001
    - -0.0
    - 0.0
    - 0.0
    std:
    - 0.356
    - 0.1927
    - 0.184
    - 0.0288
    - 0.0298
    - 0.0694
    lower_bound:
    - 0.0
    - 0.0
    - 0.0
    - -.inf
    - -.inf
    - 0.0
    upper_bound:
    - .inf
    - 1.0
    - 1.0
    - .inf
    - .inf
    - .inf
  train_augmentation:
    _target_: gensim.augmentation.DataAugmentation
    hflip:
      _target_: gensim.augmentation.HFlipTransformation
      probability: 0.5
    vflip:
      _target_: gensim.augmentation.VFlipTransformation
      probability: 0.5
    rotate:
      _target_: gensim.augmentation.RotateTransformation
      probability: 0.5
  patch_generator:
    _target_: gensim.augmentation.PatchGenerator
    mask_path: data/auxiliary/ds_auxiliary.nc
    train_with_overlap: ${surrogate.train_with_overlap}
    n_patches: 4
    patch_size:
    - 64
    - 64
    overlap_size: ${surrogate.overlap_size}
    coarse_levels:
    - 1
    - 2
    - 4
    - 8
    coarse_probs:
    - 1
    - 0.5
    - 0.25
    - 0.125
    valid_threshold: 0.1
  _target_: gensim.train_module.GenSIMTrainModule
  _recursive_: false
  lr: 0.0005
  lr_warmup: 5000
  total_steps: 1000000
  weight_decay: 0.001
  ema_rate: 0.9999
  optimize_scale: true
  censoring: true
  train_with_overlap: true
  overlap_size:
  - 8
  - 8
  ema_update_every: 4
data:
  _target_: gensim.data_module.SurrogateDataModule
  data_path: data/train_data
  aux_path: data/auxiliary/ds_auxiliary.nc
  delta_t: 1
  n_input_steps: 1
  n_rollout_steps: 1
  base_resolution: 12.5
  forcing_variables:
  - tus
  - huss
  - uas
  - vas
  state_variables:
  - sit
  - sic
  - sid
  - siu
  - siv
  - snt
  batch_size: ${batch_size}
  val_batch_size: ${batch_size}
  n_workers: ${num_workers}
  n_train_samples: null
  pin_memory: true
  fast: true
  suffix: _monthly
  threads_limit: shared
exp_name: monthly
logging_level: DEBUG
seed: 0
num_workers: 8
batch_size: 4
ckpt_path: null
compile: true
nodes: 1
devices: 8
