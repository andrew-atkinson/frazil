# SST-channel fine-tune: the monthly_pf_qm recipe + ERA5 sea-surface temperature.
#
# A/B partner: monthly_pf_qm (identical: seed monthly_pf, QM targets, pushforward
# prob 0.8 / substeps 10, 40k steps). The ONLY difference is the extra forcing
# channel, so the 2019-2025 hindcast isolates what SST adds.
#
# SST is appended to the forcings (tus huss uas vas sst), at month t and t+1, so
# the network takes 24 + 2 = 26 inputs. init_from zero-initialises the new input
# weights (gensim.utils.expand_forcing_channels): step 0 == monthly_pf exactly.
# Encoder: monthly stats + sst (mean 275.3088 K, std 5.3344 K; 1995-2018 ocean, from
# add_forcing_channels.py) inserted after the 4th and 8th forcing entries.
#
# LEAK WARNING: ERA5 sets SST to 271.46 K under the OBSERVED sea ice, so SST at
# t+1 is close to the observed ice mask (September edge disagreement 1.1 M km2,
# vs the model's own ~1.9). Evaluate with and without year-specific SST
# (see docs/OBS_GAP.md) before trusting any gain.
#
# Prereq: add_forcing_channels.py on monthly_datacube_sicqm, then
#   build_zarr_monthly.py --datacube-dir data/train_data/monthly_datacube_sicqm_era5x \
#       --suffix _sicqm_sst --extra-forcings sst
# RESUMABLE: re-run the same command; it auto-continues from last.ckpt.
# Run:  python train.py --config-name config_finetune_pf_qm_sst_mac
defaults:
  - config_finetune_pushforward_mac
  - _self_

exp_name: monthly_pf_qm_sst
init_from: data/models/monthly_pf/last.ckpt

surrogate:
  total_steps: 40000
  pushforward_prob: 0.8
  pushforward_substeps: 10
  network:
    n_input: 26
  encoder:
    mean:
